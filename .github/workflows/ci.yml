name: CI

# Lint, typecheck, test, build. Callable, so a deploy workflow runs exactly this and
# ships only what passed — no second definition of "green".
on:
  pull_request:
  workflow_call:
  # A new advisory against a dependency you already have arrives without a commit,
  # so the audit in `pnpm verify` has to run on a schedule too.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck, lint, format, knip, test, audit, build
        run: pnpm verify
